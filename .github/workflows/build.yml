name: Build MT5 Agent EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install pyinstaller websockets requests

    - name: Build EXE
      run: pyinstaller --onefile --noconsole agent.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: MT5-Agent
        path: dist/agent.exe
